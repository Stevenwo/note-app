version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: note-app-db
    environment:
      POSTGRES_DB: noteapp
      POSTGRES_USER: noteapp
      POSTGRES_PASSWORD: noteapp_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
